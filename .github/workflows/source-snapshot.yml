name: Source Snapshot

on:
  push:
    paths:
      - '.github/workflows/source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inspect embedded source data
        shell: python
        run: |
          from pathlib import Path
          import json, re, shutil

          out = Path('.source-snapshot')
          if out.exists(): shutil.rmtree(out)
          out.mkdir()
          manifest = {}
          declarations = {}
          needles = ['09.08.','10.08.','11.08.','12.08.','2026-08-09','2026-08-10','const HL','matches','spiele']
          for filename in ('index.html', 'highlights.html'):
              p = Path(filename)
              if not p.exists(): continue
              text = p.read_text(encoding='utf-8')
              stem = p.stem
              manifest[filename] = {'chars': len(text)}
              ds=[]
              for i,m in enumerate(re.finditer(r'\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*', text)):
                  ds.append({'name':m.group(1),'pos':m.start()})
                  (out / f'{stem}-decl-{i:03d}-{m.group(1)[:40]}.txt').write_text(text[max(0,m.start()-150):m.start()+2200],encoding='utf-8')
              declarations[filename]=ds
              low=text.lower()
              for needle in needles:
                  pos=low.find(needle.lower())
                  if pos>=0:
                      safe=re.sub(r'[^a-zA-Z0-9]+','_',needle).strip('_')
                      (out / f'{stem}-hit-{safe}.txt').write_text(text[max(0,pos-700):pos+5000],encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (out / 'declarations.json').write_text(json.dumps(declarations,ensure_ascii=False,indent=2),encoding='utf-8')
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .source-snapshot
          git diff --cached --quiet && exit 0
          git commit -m 'chore: create readable source inspection reports'
          git push
