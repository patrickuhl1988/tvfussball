name: Cleanup source snapshot

on:
  push:
    paths:
      - '.github/workflows/source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary migration inspection files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -f .source-snapshot 2>/dev/null || true
          git rm -f .github/workflows/source-snapshot.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove temporary redesign inspection files'
          git push
