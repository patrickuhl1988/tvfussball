name: Deploy direct redesign

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'highlights.html'
      - 'anbieter.html'
      - 'app-direct.js'
      - 'direct.css'
      - 'favicon.svg'
      - 'hero-pitch.webp'
      - 'impressum.html'
      - 'datenschutz.html'
      - '.github/workflows/deploy-direct-redesign.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvfussball-direct-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build published HTML from maintained sources
        shell: python
        run: |
          from pathlib import Path
          import re

          out = Path('/tmp/tvfussball-direct')
          out.mkdir(parents=True, exist_ok=True)
          boot = '''<script>document.documentElement.classList.add('tvf-direct-boot')</script><link rel="icon" type="image/svg+xml" href="favicon.svg?v=26"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=26"><link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=26"><link rel="shortcut icon" href="favicon.ico?v=26"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=26"><link rel="stylesheet" href="direct.css?v=26">'''
          app = '''<script src="app-direct.js?v=26"></script>'''

          for name in ('index.html', 'highlights.html', 'anbieter.html'):
              src = Path(name).read_text(encoding='utf-8')
              # Keep main untouched as Claude's maintained source. The published copies only receive the redesign hooks.
              src = re.sub(r'<link\b[^>]*rel=["\'](?:shortcut\s+)?icon["\'][^>]*>', '', src, flags=re.I)
              src = re.sub(r'<link\b[^>]*rel=["\']apple-touch-icon["\'][^>]*>', '', src, flags=re.I)
              if 'tvf-direct-boot' not in src:
                  src = src.replace('<head>', '<head>' + boot, 1)
              if 'app-direct.js' not in src:
                  src = src.replace('</body>', app + '</body>', 1)
              (out / name).write_text(src, encoding='utf-8')

      - name: Publish to gh-pages
        run: |
          git fetch origin gh-pages
          git switch gh-pages
          cp /tmp/tvfussball-direct/index.html index.html
          cp /tmp/tvfussball-direct/highlights.html highlights.html
          cp /tmp/tvfussball-direct/anbieter.html anbieter.html
          git show origin/main:app-direct.js > app-direct.js
          git show origin/main:direct.css > direct.css
          git show origin/main:favicon.svg > favicon.svg
          git show origin/main:hero-pitch.webp > hero-pitch.webp
          git show origin/main:impressum.html > impressum.html
          git show origin/main:datenschutz.html > datenschutz.html
          git show origin/main:OneSignalSDKWorker.js > OneSignalSDKWorker.js
          git show origin/main:favicon.ico > favicon.ico
          git show origin/main:favicon-16x16.png > favicon-16x16.png
          git show origin/main:favicon-32x32.png > favicon-32x32.png
          git show origin/main:apple-touch-icon.png > apple-touch-icon.png
          git show origin/main:icon-512.png > icon-512.png
          git rm -f data-bridge.js app-shell.js app-shell.css 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OneSignalSDKWorker.js index.html highlights.html anbieter.html app-direct.js direct.css favicon.svg favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png icon-512.png hero-pitch.webp impressum.html datenschutz.html
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
            exit 0
          fi
          git commit -m 'deploy: complete direct redesign'
          git push origin gh-pages
