name: Radio Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radio-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract radio and worth-score samples
        shell: python
        run: |
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8',errors='replace')
          out=[]
          for needle in ['radio:[','lohnt:{','function radio','renderRadio','radioHtml','radio:']:
              out.append('\n### '+needle+'\n')
              pos=0; n=0
              while n<20:
                  p=text.find(needle,pos)
                  if p<0: break
                  out.append(text[max(0,p-260):p+1400])
                  pos=p+len(needle); n+=1
          p=Path('.radio-inspect.txt'); p.write_text('\n'.join(out),encoding='utf-8')
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .radio-inspect.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: add radio inspection report'
          git push
